name: vanille

services:
  frontmatter:
    build:
      context: ./frontmatter
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "9101"
    ports:
      - "127.0.0.1:${FRONTMATTER_PORT:-9101}:9101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9101/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontpage:
    build:
      context: ./frontpage
    ports:
      - "127.0.0.1:${FRONTPAGE_PORT:-9100}:9100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "9000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9101,http://localhost:9100}
      MEMORY_SERVICE_URL: http://db:9003
    ports:
      - "127.0.0.1:${BACKEND_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    build:
      context: ./db
    environment:
      NEO4J_URI: bolt://neo4j:9005
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-9003}:9003"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_listen__address: 0.0.0.0:9005
      NEO4J_server_http_listen__address: 0.0.0.0:9004
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-9005}
      NEO4J_server_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-9004}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-9004}:9004"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-9005}:9005"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:9005 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

volumes:
  neo4j_data:
  neo4j_logs:
